name: sync powershell gallery manifest

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      full_sync:
        description: Run a full PowerShell Gallery scan instead of using the last successful sync as a cutoff.
        default: false
        type: boolean

concurrency:
  group: psgallery-manifest-sync
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect last successful sync
        id: last-sync
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          $uri = 'https://api.github.com/repos/{0}/actions/workflows/syncPsGalleryManifest.yaml/runs?status=success&exclude_pull_requests=true&per_page=1' -f $env:GITHUB_REPOSITORY

          try {
            $response = Invoke-RestMethod -Uri $uri -Headers $headers
            $lastSync = $response.workflow_runs | Select-Object -ExpandProperty created_at -First 1
          }
          catch {
            Write-Warning "Unable to determine the last successful sync time. Falling back to a full scan. $_"
            $lastSync = $null
          }

          if (-not [string]::IsNullOrWhiteSpace($lastSync)) {
            "value=$lastSync" >> $env:GITHUB_OUTPUT
            Write-Host "Last successful sync: $lastSync"
          }
          else {
            Write-Host 'No prior successful sync detected.'
          }
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Sync manifest
        id: sync
        run: |
          $parameters = @{
            ManifestPath = '.\manifest.json'
          }

          if ($env:FULL_SYNC -eq 'true') {
            $parameters.ForceFullSync = $true
          }
          elseif (-not [string]::IsNullOrWhiteSpace($env:LAST_SYNC)) {
            $parameters.PublishedAfter = $env:LAST_SYNC
          }
          else {
            $parameters.ForceFullSync = $true
          }

          .\.github\scripts\Sync-PsGalleryManifest.ps1 @parameters

          $manifestChanged = -not [string]::IsNullOrWhiteSpace((git status --porcelain -- manifest.json))
          if (-not $manifestChanged) {
            'changed=false' >> $env:GITHUB_OUTPUT
            Write-Host 'No manifest changes detected.'
          }
          else {
            'changed=true' >> $env:GITHUB_OUTPUT
            Write-Host 'Manifest changes detected.'
          }
        shell: pwsh
        env:
          FULL_SYNC: ${{ inputs.full_sync }}
          LAST_SYNC: ${{ steps.last-sync.outputs.value }}

      - name: Commit and push manifest update
        if: ${{ steps.sync.outputs.changed == 'true' }}
        run: |
          $branch = 'automation/powershell-gallery-manifest-sync'

          git config user.name 'Devolutions Bot'
          git config user.email 'bot@devolutions.net'
          git add manifest.json
          git commit -m 'Sync PowerShell Gallery manifest'

          if (git ls-remote --heads origin $branch) {
            git fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
          }

          git push --force-with-lease origin HEAD:$branch
        shell: pwsh

      - name: Create pull request if needed
        if: ${{ steps.sync.outputs.changed == 'true' }}
        run: |
          $branch = 'automation/powershell-gallery-manifest-sync'
          $incrementalCutoff = $env:INCREMENTAL_CUTOFF

          if ([string]::IsNullOrWhiteSpace($incrementalCutoff)) {
            $incrementalCutoff = 'full scan'
          }

          $existingPrCount = gh pr list --head $branch --base $env:BASE_BRANCH --state open --json number --jq 'length'
          if ($existingPrCount -gt 0) {
            Write-Host 'An open pull request already exists for the automation branch.'
            exit 0
          }

          $body = @"
          Automated update of manifest.json from the PowerShell Gallery NuGet feed.

          - Trigger: $env:TRIGGER
          - Incremental cutoff: $incrementalCutoff
          "@

          gh pr create --base $env:BASE_BRANCH --head $branch --title 'Sync PowerShell Gallery manifest' --body $body
        shell: pwsh
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.DEVOLUTIONSBOT_TOKEN }}
          INCREMENTAL_CUTOFF: ${{ steps.last-sync.outputs.value }}
          TRIGGER: ${{ github.event_name }}
